<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REZZ AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #fff; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { background: #1e293b; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
        .logo { font-size: 1.5em; font-weight: bold; }
        .logo span { color: #3b82f6; }
        .header-btns button { background: #334155; color: white; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; margin-left: 8px; cursor: pointer; font-weight: bold; }
        .header-btns button:hover { background: #475569; }
        #chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 0.95em; position: relative; word-wrap: break-word; }
        .time { font-size: 0.7em; color: #94a3b8; margin-top: 5px; display: block; }
        .user { background: #1d4ed8; align-self: flex-end; border-bottom-right-radius: 2px; }
        .ai { background: #1e293b; align-self: flex-start; border-bottom-left-radius: 2px; }
        .input-area { background: #1e293b; padding: 15px; display: flex; gap: 10px; border-top: 1px solid #334155; }
        input { flex: 1; padding: 12px 15px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 1em; outline: none; }
        input:focus { border-color: #3b82f6; }
        button#send-btn { background: #3b82f6; color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1em; }
        button#send-btn:disabled { background: #64748b; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div class="logo">REZZ <span>AI</span></div>
        <div class="header-btns">
            <button onclick="resetChat()">+ Baru</button>
            <button onclick="resetChat()">Hapus</button>
        </div>
    </header>

    <div id="chat-box">
        <div class="message ai">
            Halo! Senang bertemu denganmu. Saya REZZ AI. Ada yang bisa saya bantu?
            <span class="time">Baru saja</span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Tanyakan sesuatu..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Kirim</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let chatHistory = [];

        function getTime() {
            const now = new Date();
            return now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        }

        function resetChat() {
            chatBox.innerHTML = `
                <div class="message ai">
                    Halo! Senang bertemu denganmu. Saya REZZ AI. Ada yang bisa saya bantu?
                    <span class="time">${getTime()}</span>
                </div>
            `;
            chatHistory = [];
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            userInput.value = '';
            sendBtn.disabled = true;

            const loadingDiv = addMessage("Sedang berpikir...", 'ai');
            chatHistory.push({ role: "user", content: text });

            try {
                const response = await fetch("https://rezzai.eyzz1112.workers.dev", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: chatHistory })
                });

                const data = await response.json();
                chatBox.removeChild(loadingDiv);

                if (data.reply) {
                    addMessage(data.reply, 'ai');
                    chatHistory.push({ role: "assistant", content: data.reply });
                } else {
                    addMessage("Error: " + (data.error || "Gagal mendapat balasan"), 'ai');
                }
            } catch (error) {
                chatBox.removeChild(loadingDiv);
                addMessage("Error koneksi ke server REZZ AI.", 'ai');
            }
            
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const textNode = document.createTextNode(text);
            div.appendChild(textNode);
            const timeSpan = document.createElement('span');
            timeSpan.className = 'time';
            timeSpan.innerText = getTime();
            div.appendChild(timeSpan);
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }
    </script>
</body>
</html>
