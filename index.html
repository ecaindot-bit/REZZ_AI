<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>REZZ AI</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg-main: #050a0e;
      --bg-surface: #0a141c;
      --bg-card: #0d1922;
      --bg-input: #0b161f;
      --border-cyan: rgba(34, 211, 238, 0.22);
      --border-cyan-strong: rgba(34, 211, 238, 0.55);
      --cyan: #22d3ee;
      --cyan-soft: rgba(34, 211, 238, 0.14);
      --text-main: #e6f4f8;
      --text-muted: #7f9ba8;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 780px;
      margin: 0 auto;
      background: radial-gradient(circle at top center, rgba(34, 211, 238, 0.07), transparent 48%), var(--bg-main);
      position: relative;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-cyan);
      background: rgba(5, 10, 14, 0.92);
      backdrop-filter: blur(10px);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border-cyan);
      background: var(--bg-surface);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.95);
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.25);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #22d3ee, #0891b2);
      color: #031318;
      font-weight: 800;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.45);
    }

    .brand-title {
      font-weight: 800;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: #ffffff;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(13, 25, 34, 0.8);
      border: 1px solid rgba(34, 211, 238, 0.14);
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 8px var(--cyan);
    }

    /* DRAWER RIWAYAT */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 40;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .history-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 82vw;
      background: #071017;
      border-right: 1px solid var(--border-cyan);
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 50;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
    }

    .history-drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-cyan);
    }

    .drawer-header h3 {
      font-size: 14px;
      color: var(--cyan);
      letter-spacing: 0.5px;
    }

    .new-chat-drawer-btn {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-cyan-strong);
      background: var(--cyan-soft);
      color: var(--cyan);
      font-weight: 600;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 10px 11px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: rgba(13, 25, 34, 0.65);
      color: var(--text-main);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .history-item.active {
      border-color: var(--border-cyan-strong);
      background: rgba(34, 211, 238, 0.12);
    }

    .history-item-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .history-del-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 4px;
      font-size: 13px;
    }

    .history-del-btn:hover {
      color: var(--danger);
    }

    /* CHAT AREA */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    /* WELCOME SCREEN */
    .welcome-screen {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 6px;
    }

    .bot-avatar-box {
      width: 78px;
      height: 78px;
      border-radius: 22px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid var(--border-cyan-strong);
      box-shadow: 0 0 28px rgba(34, 211, 238, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }

    .bot-avatar-inner {
      width: 54px;
      height: 54px;
      border-radius: 15px;
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }

    .welcome-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .welcome-subtitle {
      font-size: 13.5px;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 340px;
      margin-bottom: 22px;
    }

    .prompt-section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: var(--cyan);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .suggestions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .suggestion-card {
      width: 100%;
      text-align: left;
      padding: 12px 14px;
      border-radius: 14px;
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .suggestion-card:active {
      border-color: var(--cyan);
      background: rgba(34, 211, 238, 0.08);
    }

    .suggestion-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid rgba(34, 211, 238, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
      flex-shrink: 0;
    }

    .suggestion-text strong {
      display: block;
      font-size: 13.5px;
      margin-bottom: 2px;
    }

    .suggestion-text span {
      font-size: 11.5px;
      color: var(--text-muted);
    }

    /* MESSAGES */
    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 88%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .message-row.assistant {
      align-self: flex-start;
      align-items: flex-start;
      max-width: 94%;
    }

    .msg-bubble {
      position: relative;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-wrap: break-word;
      overflow-wrap: break-word;
    }

    .message-row.user .msg-bubble {
      background: linear-gradient(135deg, #0e3a47, #0a2833);
      border: 1px solid var(--border-cyan-strong);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .message-row.assistant .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      color: var(--text-main);
      border-bottom-left-radius: 4px;
      width: 100%;
    }

    /* TOMBOL SALIN DI POJOK KANAN ATAS */
    .top-copy-btn {
      position: sticky;
      top: 0;
      float: right;
      margin: 0 0 6px 10px;
      background: rgba(34, 211, 238, 0.14);
      border: 1px solid rgba(34, 211, 238, 0.38);
      color: var(--cyan);
      border-radius: 7px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      z-index: 5;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .top-copy-btn:hover,
    .top-copy-btn:active {
      background: rgba(34, 211, 238, 0.25);
      transform: scale(0.97);
    }

    .msg-attachments {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .msg-media-thumb {
      max-width: 190px;
      max-height: 190px;
      border-radius: 10px;
      border: 1px solid var(--border-cyan);
      object-fit: cover;
      display: block;
    }

    .msg-file-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 9px;
      background: rgba(34, 211, 238, 0.12);
      border: 1px solid var(--border-cyan);
      font-size: 12px;
      color: var(--cyan);
    }

    /* SEGMEN TEKS BIASA & BLOK KODE TERPISAH */
    .msg-prose-segment {
      margin-bottom: 8px;
    }

    .msg-prose-segment:last-child {
      margin-bottom: 0;
    }

    .msg-bubble p {
      margin-bottom: 8px;
    }
    .msg-bubble p:last-child {
      margin-bottom: 0;
    }
    .msg-bubble ul, .msg-bubble ol {
      padding-left: 20px;
      margin-bottom: 8px;
    }
    .msg-bubble pre {
      position: relative;
      background: #070d12;
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: 10px;
      padding: 34px 12px 12px;
      margin: 8px 0;
      overflow-x: auto;
      font-size: 12.5px;
    }
    .msg-bubble code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .copy-code-btn {
      position: absolute;
      top: 6px;
      right: 8px;
      background: rgba(34, 211, 238, 0.14);
      border: 1px solid rgba(34, 211, 238, 0.35);
      color: var(--cyan);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .copy-code-btn:active {
      background: rgba(34, 211, 238, 0.28);
    }

    /* LOADING DOTS */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }
    .typing-indicator span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.45; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* INPUT AREA & ATTACHMENT PREVIEW */
    .input-wrapper {
      padding: 8px 12px 10px;
      background: rgba(5, 10, 14, 0.96);
      border-top: 1px solid rgba(34, 211, 238, 0.12);
      position: relative;
      z-index: 25;
    }

    .attachment-preview-bar {
      display: none;
      flex-wrap: wrap;
      gap: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      background: var(--bg-surface);
      border: 1px solid var(--border-cyan);
      border-radius: 14px;
    }

    .attachment-preview-bar.has-items {
      display: flex;
    }

    .preview-chip {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-cyan);
      border-radius: 10px;
      padding: 5px 28px 5px 7px;
      max-width: 210px;
    }

    .preview-chip img,
    .preview-chip video {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .preview-chip-icon {
      width: 38px;
      height: 38px;
      border-radius: 7px;
      background: var(--cyan-soft);
      color: var(--cyan);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .preview-chip-info {
      overflow: hidden;
    }

    .preview-chip-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }

    .preview-chip-type {
      font-size: 10.5px;
      color: var(--text-muted);
    }

    .remove-attachment-btn {
      position: absolute;
      top: 4px;
      right: 5px;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      border: none;
      background: rgba(248, 113, 113, 0.2);
      color: var(--danger);
      font-size: 12px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* POPUP MENU TANDA PLUS (+) ALA GEMINI */
    .plus-menu {
      position: absolute;
      left: 14px;
      bottom: 72px;
      width: 210px;
      background: #0a1620;
      border: 1px solid var(--border-cyan-strong);
      border-radius: 16px;
      padding: 6px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.75), 0 0 18px rgba(34, 211, 238, 0.18);
      display: none;
      flex-direction: column;
      gap: 4px;
      z-index: 35;
      animation: popUp 0.16s ease;
    }

    .plus-menu.open {
      display: flex;
    }

    @keyframes popUp {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .plus-menu-item {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      gap: 11px;
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s ease;
    }

    .plus-menu-item:hover,
    .plus-menu-item:active {
      background: rgba(34, 211, 238, 0.14);
      color: #ffffff;
    }

    .plus-menu-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(34, 211, 238, 0.12);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* INPUT BAR */
    .input-bar {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-input);
      border: 1px solid var(--border-cyan);
      border-radius: 24px;
      padding: 6px 8px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-bar:focus-within {
      border-color: var(--cyan);
      box-shadow: 0 0 16px rgba(34, 211, 238, 0.18);
    }

    .plus-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(34, 211, 238, 0.28);
      background: rgba(34, 211, 238, 0.1);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .plus-btn.active {
      transform: rotate(45deg);
      background: rgba(34, 211, 238, 0.22);
      border-color: var(--cyan);
    }

    #messageInput {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 14.5px;
      line-height: 1.4;
      max-height: 110px;
      min-height: 36px;
      padding: 7px 4px;
      resize: none;
      font-family: inherit;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    .mic-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid rgba(34, 211, 238, 0.25);
      background: rgba(34, 211, 238, 0.08);
      color: var(--cyan);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.2s ease;
    }

    .mic-btn.listening {
      background: rgba(248, 113, 113, 0.2);
      border-color: var(--danger);
      color: var(--danger);
      box-shadow: 0 0 14px rgba(248, 113, 113, 0.45);
      animation: pulseMic 1.1s infinite;
    }

    @keyframes pulseMic {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .send-btn {
      width: 38px;
      height: 36px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      color: #041318;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 12px rgba(34, 211, 238, 0.35);
      transition: 0.18s ease;
    }

    .send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
    }

    .footer-note {
      text-align: center;
      font-size: 10.5px;
      color: #5c7682;
      margin-top: 6px;
    }

    /* MODAL KAMERA LANGSUNG (JIKA BROWSER/WEBVIEW MENDUKUNG GETUSERMEDIA) */
    .camera-modal {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 9, 0.95);
      z-index: 60;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .camera-modal.open {
      display: flex;
    }

    .camera-video-box {
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid var(--border-cyan-strong);
      background: #000;
      position: relative;
    }

    #liveCameraVideo {
      width: 100%;
      max-height: 62vh;
      object-fit: cover;
      display: block;
    }

    .camera-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
    }

    .cam-action-btn {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--border-cyan-strong);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .cam-capture-btn {
      padding: 11px 22px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #22d3ee, #06b6d4);
      color: #031318;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(34, 211, 238, 0.45);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- HEADER -->
    <header class="header">
      <div class="header-left">
        <button class="icon-btn" id="menuBtn" title="Riwayat Chat" aria-label="Riwayat Chat">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round">
            <line x1="4" y1="9" x2="20" y2="9"></line>
            <line x1="4" y1="15" x2="20" y2="15"></line>
          </svg>
        </button>
        <div class="brand">

  <script>
    const WORKER_URL = "https://rezzai.eyzz1112.workers.dev";
    const STORAGE_KEY = "rezz_ai_sessions_v2";
    const MAX_FILES = 5;
    const MAX_SINGLE_FILE_BYTES = 10 * 1024 * 1024; // ~10 MB

    let sessions = [];
    let currentSessionId = null;
    let pendingAttachments = [];
    let isSending = false;
    let cameraStream = null;
    let useFrontCamera = false;

    const chatArea = document.getElementById("chatArea");
    const welcomeScreen = document.getElementById("welcomeScreen");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const micBtn = document.getElementById("micBtn");

    const plusBtn = document.getElementById("plusBtn");
    const plusMenu = document.getElementById("plusMenu");
    const attachmentPreviewBar = document.getElementById("attachmentPreviewBar");

    const optCamera = document.getElementById("optCamera");
    const optPhoto = document.getElementById("optPhoto");
    const optVideo = document.getElementById("optVideo");
    const optFile = document.getElementById("optFile");

    const cameraInput = document.getElementById("cameraInput");
    const photoInput = document.getElementById("photoInput");
    const videoInput = document.getElementById("videoInput");
    const fileInput = document.getElementById("fileInput");

    const menuBtn = document.getElementById("menuBtn");
    const closeDrawerBtn = document.getElementById("closeDrawerBtn");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const historyDrawer = document.getElementById("historyDrawer");
    const historyList = document.getElementById("historyList");
    const newChatBtn = document.getElementById("newChatBtn");
    const drawerNewChatBtn = document.getElementById("drawerNewChatBtn");
    const deleteChatBtn = document.getElementById("deleteChatBtn");

    const cameraModal = document.getElementById("cameraModal");
    const liveCameraVideo = document.getElementById("liveCameraVideo");
    const switchCamBtn = document.getElementById("switchCamBtn");
    const capturePhotoBtn = document.getElementById("capturePhotoBtn");
    const closeCameraBtn = document.getElementById("closeCameraBtn");

    // --- SESSION MANAGEMENT ---
    function loadSessions() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        sessions = raw ? JSON.parse(raw) : [];
      } catch (_) {
        sessions = [];
      }
      if (!Array.isArray(sessions) || sessions.length === 0) {
        createNewSession(false);
      } else {
        currentSessionId = sessions[0].id;
      }
    }

    function saveSessions() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      } catch (e) {
        console.warn("Gagal menyimpan riwayat ke localStorage:", e);
      }
    }

    function getCurrentSession() {
      return sessions.find(s => s.id === currentSessionId) || null;
    }

    function createNewSession(render = true) {
      const id = "chat_" + Date.now();
      sessions.unshift({
        id,
        title: "Percakapan Baru",
        messages: []
      });
      currentSessionId = id;
      pendingAttachments = [];
      renderAttachmentPreviews();
      saveSessions();
      if (render) {
        renderHistoryList();
        renderChat();
      }
    }

    function deleteCurrentSession() {
      if (!currentSessionId) return;
      sessions = sessions.filter(s => s.id !== currentSessionId);
      if (sessions.length === 0) {
        createNewSession(true);
      } else {
        currentSessionId = sessions[0].id;
        saveSessions();
        renderHistoryList();
        renderChat();
      }
    }

    function renderHistoryList() {
      historyList.innerHTML = "";
      sessions.forEach(session => {
        const item = document.createElement("div");
        item.className = "history-item" + (session.id === currentSessionId ? " active" : "");

        const titleSpan = document.createElement("span");
        titleSpan.className = "history-item-title";
        titleSpan.textContent = session.title || "Percakapan Baru";
        titleSpan.onclick = () => {
          currentSessionId = session.id;
          closeDrawer();
          renderHistoryList();
          renderChat();
        };

        const delBtn = document.createElement("button");
        delBtn.className = "history-del-btn";
        delBtn.textContent = "✕";
        delBtn.title = "Hapus";
        delBtn.onclick = (e) => {
          e.stopPropagation();
          sessions = sessions.filter(s => s.id !== session.id);
          if (sessions.length === 0) {
            createNewSession(true);
          } else {
            if (currentSessionId === session.id) currentSessionId = sessions[0].id;
            saveSessions();
            renderHistoryList();
            renderChat();
          }
        };

        item.appendChild(titleSpan);
        item.appendChild(delBtn);
        historyList.appendChild(item);
      });
    }

    // --- DRAWER ---
    function openDrawer() {
      renderHistoryList();
      historyDrawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      historyDrawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    menuBtn.addEventListener("click", openDrawer);
    closeDrawerBtn.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);
    newChatBtn.addEventListener("click", () => createNewSession(true));
    drawerNewChatBtn.addEventListener("click", () => {
      createNewSession(true);
      closeDrawer();
    });
    deleteChatBtn.addEventListener("click", deleteCurrentSession);

    // --- MENU PLUS (+) ---
    function togglePlusMenu(forceState) {
      const willOpen = typeof forceState === "boolean" ? forceState : !plusMenu.classList.contains("open");
      plusMenu.classList.toggle("open", willOpen);
      plusBtn.classList.toggle("active", willOpen);
    }

    plusBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      togglePlusMenu();
    });

    document.addEventListener("click", (e) => {
      if (!plusMenu.contains(e.target) && !plusBtn.contains(e.target)) {
        togglePlusMenu(false);
      }
    });

    // --- IZIN KAMERA & AMBIL FOTO ---
    async function openCameraWithPermission() {
      togglePlusMenu(false);

      // Minta izin kamera via getUserMedia terlebih dahulu agar dialog izin kamera muncul jelas
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          if (cameraStream) {
            cameraStream.getTracks().forEach(t => t.stop());
          }
          cameraStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: useFrontCamera ? "user" : "environment" },
            audio: false
          });
          liveCameraVideo.srcObject = cameraStream;
          cameraModal.classList.add("open");
          return;
        } catch (err) {
          console.warn("Fallback ke input kamera sistem:", err);
        }
      }

      // Fallback langsung ke aplikasi kamera bawaan perangkat
      cameraInput.click();
    }

    function stopLiveCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
      liveCameraVideo.srcObject = null;
      cameraModal.classList.remove("open");
    }

    optCamera.addEventListener("click", openCameraWithPermission);

    switchCamBtn.addEventListener("click", async () => {
      useFrontCamera = !useFrontCamera;
      await openCameraWithPermission();
    });

    capturePhotoBtn.addEventListener("click", () => {
      if (!liveCameraVideo.videoWidth) return;
      const canvas = document.createElement("canvas");
      canvas.width = liveCameraVideo.videoWidth;
      canvas.height = liveCameraVideo.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(liveCameraVideo, 0, 0, canvas.width, canvas.height);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.88);
      const base64Data = dataUrl.split(",")[1];
      addAttachmentItem({
        name: `kamera_${Date.now()}.jpg`,
        mimeType: "image/jpeg",
        data: base64Data,
        previewUrl: dataUrl,
        kind: "image"
      });
      stopLiveCamera();
    });

    closeCameraBtn.addEventListener("click", stopLiveCamera);

    // --- FOTO, VIDEO, DAN FILE ---
    optPhoto.addEventListener("click", () => {
      togglePlusMenu(false);
      photoInput.click();
    });

    optVideo.addEventListener("click", () => {
      togglePlusMenu(false);
      videoInput.click();
    });

    optFile.addEventListener("click", () => {
      togglePlusMenu(false);
      fileInput.click();
    });

    function guessMimeType(file) {
      if (file.type) return file.type;
      const name = file.name.toLowerCase();
      if (name.endsWith(".pdf")) return "application/pdf";
      if (name.endsWith(".json")) return "application/json";
      if (name.endsWith(".csv")) return "text/csv";
      if (name.endsWith(".js")) return "application/javascript";
      if (name.endsWith(".html") || name.endsWith(".htm")) return "text/html";
      if (name.endsWith(".css")) return "text/css";
      if (name.endsWith(".md") || name.endsWith(".txt") || name.endsWith(".py")) return "text/plain";
      return "application/octet-stream";
    }

    function readFileAsBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const result = String(reader.result || "");
          const base64 = result.includes(",") ? result.split(",")[1] : result;
          resolve({ base64, dataUrl: result });
        };
        reader.onerror = () => reject(new Error("Gagal membaca file."));
        reader.readAsDataURL(file);
      });
    }

    function addAttachmentItem(item) {
      if (pendingAttachments.length >= MAX_FILES) {
        alert(`Maksimal ${MAX_FILES} lampiran dalam sekali kirim.`);
        return;
      }
      pendingAttachments.push(item);
      renderAttachmentPreviews();
    }

    async function handleSelectedFiles(fileList, forcedKind) {
      const files = Array.from(fileList || []);
      for (const file of files) {
        if (pendingAttachments.length >= MAX_FILES) {
          alert(`Maksimal ${MAX_FILES} lampiran dalam sekali kirim.`);
          break;
        }
        if (file.size > MAX_SINGLE_FILE_BYTES) {
          alert(`Ukuran "${file.name}" terlalu besar (maksimal ~10 MB). Gunakan video pendek atau file yang lebih ringan.`);
          continue;
        }

        const mimeType = guessMimeType(file);
        const kind =
          forcedKind ||
          (mimeType.startsWith("image/") ? "image" : mimeType.startsWith("video/") ? "video" : "file");

        try {
          const { base64, dataUrl } = await readFileAsBase64(file);
          const previewUrl = kind === "video" ? URL.createObjectURL(file) : dataUrl;
          addAttachmentItem({
            name: file.name,
            mimeType,
            data: base64,
            previewUrl,
            kind
          });
        } catch (err) {
          alert(`Gagal memproses file "${file.name}".`);
        }
      }
    }

    cameraInput.addEventListener("change", async (e) => {
      await handleSelectedFiles(e.target.files, "image");
      e.target.value = "";
    });

    photoInput.addEventListener("change", async (e) => {
      await handleSelectedFiles(e.target.files, "image");
      e.target.value = "";
    });

    videoInput.addEventListener("change", async (e) => {
      await handleSelectedFiles(e.target.files, "video");
      e.target.value = "";
    });

    fileInput.addEventListener("change", async (e) => {
      await handleSelectedFiles(e.target.files, "file");
      e.target.value = "";
    });

    function renderAttachmentPreviews() {
      attachmentPreviewBar.innerHTML = "";
      if (pendingAttachments.length === 0) {
        attachmentPreviewBar.classList.remove("has-items");
        return;
      }

      attachmentPreviewBar.classList.add("has-items");
      pendingAttachments.forEach((item, idx) => {
        const chip = document.createElement("div");
        chip.className = "preview-chip";

        if (item.kind === "image") {
          const img = document.createElement("img");
          img.src = item.previewUrl;
          img.alt = item.name;
          chip.appendChild(img);
        } else if (item.kind === "video") {
          const vid = document.createElement("video");
          vid.src = item.previewUrl;
          vid.muted = true;
          chip.appendChild(vid);
        } else {
          const icon = document.createElement("div");
          icon.className = "preview-chip-icon";
          icon.textContent = "📄";
          chip.appendChild(icon);
        }

        const info = document.createElement("div");
        info.className = "preview-chip-info";
        info.innerHTML = `
          <div class="preview-chip-name">${escapeHtml(item.name)}</div>
          <div class="preview-chip-type">${item.kind === "image" ? "Foto" : item.kind === "video" ? "Video" : "File"}</div>
        `;
        chip.appendChild(info);

        const rm = document.createElement("button");
        rm.type = "button";
        rm.className = "remove-attachment-btn";
        rm.textContent = "✕";
        rm.onclick = () => {
          pendingAttachments.splice(idx, 1);
          renderAttachmentPreviews();
        };
        chip.appendChild(rm);

        attachmentPreviewBar.appendChild(chip);
      });
    }

    // --- SALIN HELPER & SEPARASI TEKS / KODE ---
    async function copyToClipboardSafe(text) {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (_) {}
      }
      const temp = document.createElement("textarea");
      temp.value = text;
      temp.style.position = "fixed";
      temp.style.opacity = "0";
      document.body.appendChild(temp);
      temp.focus();
      temp.select();
      try {
        document.execCommand("copy");
      } catch (_) {}
      temp.remove();
    }

    function splitTextAndCode(rawText) {
      const text = String(rawText || "");
      const fenceRegex = /```([a-zA-Z0-9_-]*)\n?([\s\S]*?)```/g;
      const segments = [];
      let lastIndex = 0;
      let match;

      while ((match = fenceRegex.exec(text)) !== null) {
        if (match.index > lastIndex) {
          const prose = text.slice(lastIndex, match.index).trim();
          if (prose) {
            segments.push({ type: "prose", content: prose });
          }
        }
        const lang = (match[1] || "").trim();
        const code = (match[2] || "").replace(/\n+$/, "");
        segments.push({ type: "code", lang, content: code });
        lastIndex = fenceRegex.lastIndex;
      }

      if (lastIndex < text.length) {
        const trailing = text.slice(lastIndex).trim();
        if (trailing) {
          segments.push({ type: "prose", content: trailing });
        }
      }

      if (segments.length === 0 && text.trim()) {
        segments.push({ type: "prose", content: text.trim() });
      }

      return segments;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatAssistantHtml(text) {
      if (window.marked) {
        return marked.parse(text || "");
      }
      return `<p>${escapeHtml(text || "").replace(/\n/g, "<br>")}</p>`;
    }

    function renderAssistantSegments(container, rawText) {
      const segments = splitTextAndCode(rawText);
      const prosePartsOnly = segments
        .filter(s => s.type === "prose")
        .map(s => s.content)
        .join("\n\n")
        .trim();

      segments.forEach((seg) => {
        if (seg.type === "prose") {
          const proseBox = document.createElement("div");
          proseBox.className = "msg-prose-segment";
          proseBox.innerHTML = formatAssistantHtml(seg.content);
          container.appendChild(proseBox);
        } else {
          const pre = document.createElement("pre");
          const codeEl = document.createElement("code");
          if (seg.lang) {
            codeEl.className = `language-${seg.lang}`;
          }
          codeEl.textContent = seg.content;
          pre.appendChild(codeEl);

          if (window.hljs) {
            hljs.highlightElement(codeEl);
          }

          // Salin khusus isi blok kode ini saja (kata pembuka/penutup AI tidak ikut)
          const copyBtn = document.createElement("button");
          copyBtn.type = "button";
          copyBtn.className = "copy-code-btn";
          copyBtn.textContent = "Salin";
          copyBtn.onclick = async () => {
            await copyToClipboardSafe(seg.content);
            copyBtn.textContent = "Tersalin!";
            setTimeout(() => (copyBtn.textContent = "Salin"), 1500);
          };

          pre.appendChild(copyBtn);
          container.appendChild(pre);
        }
      });

      // Tombol Salin sekali ketuk di pojok kanan atas teks biasa (tanpa blok kode)
      if (prosePartsOnly) {
        const copyTextBtn = document.createElement("button");
        copyTextBtn.type = "button";
        copyTextBtn.className = "top-copy-btn";
        copyTextBtn.textContent = "Salin";
        copyTextBtn.title = "Salin teks biasa saja (tanpa blok kode)";
        copyTextBtn.onclick = async () => {
          await copyToClipboardSafe(prosePartsOnly);
          copyTextBtn.textContent = "Tersalin!";
          setTimeout(() => (copyTextBtn.textContent = "Salin"), 1500);
        };
        container.prepend(copyTextBtn);
      }
    }

    function createMessageElement(msg) {
      const row = document.createElement("div");
      row.className = `message-row ${msg.role === "assistant" ? "assistant" : "user"}`;

      const bubble = document.createElement("div");
      bubble.className = "msg-bubble";

      if (msg.role === "user" && msg.content) {
        const copyUserBtn = document.createElement("button");
        copyUserBtn.type = "button";
        copyUserBtn.className = "top-copy-btn";
        copyUserBtn.textContent = "Salin";
        copyUserBtn.title = "Salin teks pesan";
        copyUserBtn.onclick = async () => {
          await copyToClipboardSafe(msg.content);
          copyUserBtn.textContent = "Tersalin!";
          setTimeout(() => (copyUserBtn.textContent = "Salin"), 1500);
        };
        bubble.appendChild(copyUserBtn);
      }

      if (Array.isArray(msg.attachmentsMeta) && msg.attachmentsMeta.length > 0) {
        const attBox = document.createElement("div");
        attBox.className = "msg-attachments";
        msg.attachmentsMeta.forEach((att) => {
          if (att.kind === "image" && att.thumbUrl) {
            const img = document.createElement("img");
            img.src = att.thumbUrl;
            img.className = "msg-media-thumb";
            attBox.appendChild(img);
          } else {
            const chip = document.createElement("div");
            chip.className = "msg-file-chip";
            chip.textContent = `${att.kind === "video" ? "🎬" : "📄"} ${att.name}`;
            attBox.appendChild(chip);
          }
        });
        bubble.appendChild(attBox);
      }

      if (msg.role === "assistant") {
        const contentDiv = document.createElement("div");
        renderAssistantSegments(contentDiv, msg.content || "");
        bubble.appendChild(contentDiv);
      } else if (msg.content) {
        const textDiv = document.createElement("div");
        textDiv.innerHTML = escapeHtml(msg.content).replace(/\n/g, "<br>");
        bubble.appendChild(textDiv);
      }

      row.appendChild(bubble);
      return row;
    }

    function renderChat() {
      const session = getCurrentSession();
      chatArea.innerHTML = "";

      if (!session || session.messages.length === 0) {
        chatArea.appendChild(welcomeScreen);
        welcomeScreen.style.display = "flex";
        return;
      }

      welcomeScreen.style.display = "none";
      session.messages.forEach((msg) => {
        chatArea.appendChild(createMessageElement(msg));
      });
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    // --- KIRIM PESAN KE WORKER ---
    async function sendMessage(customText) {
      if (isSending) return;

      const text = (typeof customText === "string" ? customText : messageInput.value).trim();
      if (!text && pendingAttachments.length === 0) return;

      const session = getCurrentSession();
      if (!session) return;

      // Siapkan metadata ringan untuk riwayat chat (tanpa menyimpan base64 video/file besar ke localStorage)
      const attachmentsToSend = pendingAttachments.map(item => ({
        name: item.name,
        mimeType: item.mimeType,
        data: item.data
      }));

      const attachmentsMeta = pendingAttachments.map(item => ({
        name: item.name,
        kind: item.kind,
        thumbUrl: item.kind === "image" ? item.previewUrl : null
      }));

      const displayPrompt = text || (attachmentsMeta.length === 1 ? `Mengirim ${attachmentsMeta[0].name}` : `Mengirim ${attachmentsMeta.length} lampiran`);

      if (session.messages.length === 0) {
        session.title = displayPrompt.slice(0, 34);
      }

      const userMsg = {
        role: "user",
        content: text,
        attachmentsMeta
      };

      session.messages.push(userMsg);
      saveSessions();
      renderHistoryList();
      renderChat();

      messageInput.value = "";
      autoResizeInput();
      pendingAttachments = [];
      renderAttachmentPreviews();

      // Bubble loading
      isSending = true;
      sendBtn.disabled = true;
      const loadingRow = document.createElement("div");
      loadingRow.className = "message-row assistant";
      loadingRow.innerHTML = `
        <div class="msg-bubble">
          <div class="typing-indicator"><span></span><span></span><span></span></div>
        </div>
      `;
      chatArea.appendChild(loadingRow);
      chatArea.scrollTop = chatArea.scrollHeight;

      try {
        // Kirim riwayat percakapan ringkas + lampiran aktif saat ini
        const apiMessages = session.messages.map((m, idx) => {
          let contentText = m.content || "";
          if (!contentText && idx === session.messages.length - 1 && attachmentsToSend.length > 0) {
            contentText = "Tolong analisis dan jelaskan lampiran yang saya kirimkan.";
          } else if (m.attachmentsMeta && m.attachmentsMeta.length > 0 && idx < session.messages.length - 1) {
            const names = m.attachmentsMeta.map(a => a.name).join(", ");
            contentText = `${contentText}\n[Lampiran sebelumnya: ${names}]`.trim();
          }
          return {
            role: m.role,
            content: contentText
          };
        });

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            messages: apiMessages,
            attachments: attachmentsToSend
          })
        });

        const data = await response.json();
        loadingRow.remove();

        if (!response.ok || data.error) {
          session.messages.push({
            role: "assistant",
            content: `⚠️ ${data.error || "Terjadi kesalahan saat memproses permintaan."}`
          });
        } else {
          session.messages.push({
            role: "assistant",
            content: data.reply || "Maaf, tidak ada respons."
          });
        }
      } catch (err) {
        loadingRow.remove();
        session.messages.push({
          role: "assistant",
          content: "⚠️ Gagal terhubung ke server REZZ AI. Periksa koneksi internetmu."
        });
      } finally {
        isSending = false;
        sendBtn.disabled = false;
        saveSessions();
        renderChat();
      }
    }

    // --- AUTO RESIZE TEXTAREA & ENTER ---
    function autoResizeInput() {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + "px";
    }

    messageInput.addEventListener("input", autoResizeInput);
    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    sendBtn.addEventListener("click", () => sendMessage());

    document.querySelectorAll(".suggestion-card").forEach((card) => {
      card.addEventListener("click", () => {
        const prompt = card.getAttribute("data-prompt");
        if (prompt) sendMessage(prompt);
      });
    });

    // --- VOICE INPUT (LISTEN-THEN-PROCESS) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = "id-ID";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;

      let listening = false;

      micBtn.addEventListener("click", () => {
        if (listening) {
          recognition.stop();
          return;
        }
        try {
          recognition.start();
        } catch (_) {}
      });

      recognition.onstart = () => {
        listening = true;
        micBtn.classList.add("listening");
      };

      recognition.onresult = (event) => {
        const transcript = event.results?.[0]?.[0]?.transcript || "";
        if (transcript.trim()) {
          messageInput.value = (messageInput.value ? messageInput.value + " " : "") + transcript.trim();
          autoResizeInput();
        }
      };

      recognition.onerror = () => {
        listening = false;
        micBtn.classList.remove("listening");
      };

      recognition.onend = () => {
        listening = false;
        micBtn.classList.remove("listening");
      };
    } else {
      micBtn.addEventListener("click", () => {
        alert("Browser ini belum mendukung input suara.");
      });
    }

    // --- INIT ---
    loadSessions();
    renderHistoryList();
    renderChat();
  </script>
</body>
</html>
