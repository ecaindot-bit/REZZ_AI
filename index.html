
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080818">
<meta name="description" content="REZZ AI - Asisten Pintar Masa Depan">
<title>REZZ AI — Asisten Pintar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080818;
  --surface: #101027;
  --surface-2: #171735;
  --surface-3: #202044;
  --border: rgba(151,145,255,.13);
  --border-hover: rgba(139,92,246,.5);
  --blue: #4385ff;
  --violet: #9565ff;
  --cyan: #38d9ee;
  --text: #f0efff;
  --muted: #9292b5;
  --dim: #626283;
  --gradient: linear-gradient(135deg,#4385ff,#9565ff);
  --glow: 0 0 35px rgba(117,91,255,.2);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  overscroll-behavior: none;
}

button, textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.app {
  width: 100%;
  max-width: 1000px;
  height: 100dvh;
  margin: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 10% 10%,rgba(67,133,255,.09),transparent 38%),
    radial-gradient(ellipse at 90% 90%,rgba(149,101,255,.09),transparent 38%),
    #0b0b20;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* HEADER */

.header {
  height: 76px;
  min-height: 76px;
  padding: 0 23px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
  background: rgba(13,13,35,.88);
  backdrop-filter: blur(20px);
  z-index: 5;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--gradient);
  font-family: 'Space Grotesk',sans-serif;
  font-size: 24px;
  font-weight: 700;
  color: white;
  box-shadow: 0 5px 25px rgba(105,91,255,.3);
}

.brand-text h1 {
  font-family: 'Space Grotesk',sans-serif;
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 1.1px;
  background: linear-gradient(100deg,#65a5ff,#b38aff,#43d8ec);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.brand-text p {
  font-size: 10px;
  color: var(--muted);
  margin-top: 3px;
  letter-spacing: .5px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  color: #9d9db9;
}

.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #37dca0;
  box-shadow: 0 0 10px rgba(55,220,160,.6);
}

.icon-btn {
  width: 39px;
  height: 39px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface-2);
  color: var(--muted);
  display: grid;
  place-items: center;
  font-size: 16px;
  transition: .25s;
}

.icon-btn:hover {
  border-color: var(--border-hover);
  color: white;
  background: #25204a;
}

.icon-btn:focus-visible,
.suggestion:focus-visible,
.btn-send:focus-visible {
  outline: 2px solid var(--violet);
  outline-offset: 3px;
}

/* CHAT AREA */

.chat-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 35px 25px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  scroll-behavior: smooth;
  scrollbar-width: thin;
  scrollbar-color: #37345f transparent;
}

.chat-area::-webkit-scrollbar {
  width: 5px;
}

.chat-area::-webkit-scrollbar-thumb {
  background: #37345f;
  border-radius: 10px;
}

/* WELCOME */

.welcome {
  width: 100%;
  max-width: 590px;
  margin: auto;
  padding: 25px 0;
  text-align: center;
  animation: fadeUp .7s ease;
}

.welcome-orb {
  width: 94px;
  height: 94px;
  margin: 0 auto 24px;
  position: relative;
  display: grid;
  place-items: center;
  border-radius: 30px;
  background: linear-gradient(145deg,#4385ff,#8054e9);
  font-size: 43px;
  box-shadow:
    0 10px 45px rgba(102,83,255,.3),
    inset 0 1px 1px rgba(255,255,255,.25);
  animation: floating 4s ease-in-out infinite;
}

.welcome-orb::before {
  content: "";
  position: absolute;
  inset: -9px;
  border: 1px solid rgba(144,114,255,.3);
  border-radius: 37px;
  animation: ring 3s ease-out infinite;
}

.welcome-orb::after {
  content: "";
  position: absolute;
  inset: -17px;
  border: 1px solid rgba(144,114,255,.12);
  border-radius: 43px;
}

.welcome h2 {
  font-family: 'Space Grotesk',sans-serif;
  font-size: clamp(24px,5vw,34px);
  font-weight: 700;
  letter-spacing: -.7px;
  background: linear-gradient(100deg,#66a8ff,#a887ff,#48d9e9);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 12px;
}

.welcome-description {
  font-size: 13px;
  line-height: 1.8;
  color: var(--muted);
  max-width: 390px;
  margin: 0 auto 30px;
}

.welcome-label {
  color: #77769c;
  font-size: 10px;
  letter-spacing: 1.5px;
  font-weight: 700;
  margin-bottom: 13px;
  text-transform: uppercase;
}

/* SUGGESTIONS */

.suggestions {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 11px;
  text-align: left;
}

.suggestion {
  min-height: 67px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: rgba(24,24,54,.72);
  color: var(--text);
  text-align: left;
  transition: .25s;
}

.suggestion:hover {
  transform: translateY(-3px);
  background: rgba(63,54,119,.25);
  border-color: var(--border-hover);
}

.suggestion .emoji {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 11px;
  background: rgba(135,111,255,.12);
  font-size: 18px;
}

.suggestion-text strong {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

.suggestion-text small {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

/* MESSAGE */

.message {
  width: fit-content;
  max-width: 85%;
  display: flex;
  gap: 11px;
  align-items: flex-start;
  animation: fadeUp .3s ease;
}

.message.user {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message.ai {
  align-self: flex-start;
}

.avatar {
  width: 35px;
  height: 35px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-size: 16px;
}

.message.ai .avatar {
  background: var(--gradient);
  box-shadow: 0 3px 14px rgba(111,91,255,.2);
}

.message.user .avatar {
  background: #252542;
  border: 1px solid var(--border);
}

.bubble {
  padding: 13px 16px;
  font-size: 13px;
  line-height: 1.75;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  border-radius: 16px;
}

.message.ai .bubble {
  background: #171731;
  border: 1px solid var(--border);
  border-top-left-radius: 4px;
  color: #e8e7fa;
}

.message.user .bubble {
  background: var(--gradient);
  border-top-right-radius: 4px;
  color: white;
  box-shadow: 0 5px 20px rgba(75,95,255,.17);
}

/* TYPING */

.typing {
  display: flex;
  align-items: center;
  gap: 5px;
  min-height: 43px;
}

.typing span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #a98cff;
  animation: bounce 1.2s infinite;
}

.typing span:nth-child(2) {
  animation-delay: .15s;
}

.typing span:nth-child(3) {
  animation-delay: .3s;
}

/* INPUT */

.input-area {
  padding: 14px 22px 12px;
  border-top: 1px solid var(--border);
  background: rgba(13,13,35,.94);
  backdrop-filter: blur(20px);
}

.input-container {
  max-width: 800px;
  margin: 0 auto;
}

.input-wrapper {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding: 8px 8px 8px 17px;
  background: #191932;
  border: 1px solid rgba(145,130,255,.2);
  border-radius: 17px;
  transition: .25s;
}

.input-wrapper:focus-within {
  border-color: rgba(143,108,255,.75);
  box-shadow: 0 0 0 3px rgba(139,92,246,.09);
}

#userInput {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  padding: 10px 0;
  border: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  line-height: 1.6;
}

#userInput::placeholder {
  color: #737394;
}

.btn-send {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border: none;
  border-radius: 13px;
  background: var(--gradient);
  color: white;
  font-size: 20px;
  box-shadow: 0 4px 17px rgba(117,91,255,.25);
  transition: .25s;
}

.btn-send:hover {
  transform: scale(1.05);
  box-shadow: 0 5px 24px rgba(117,91,255,.4);
}

.btn-send:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.disclaimer {
  text-align: center;
  margin-top: 10px;
  color: #666685;
  font-size: 10px;
}

/* ANIMATIONS */

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes floating {
  0%,100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes ring {
  0% { transform: scale(1); opacity: .6; }
  100% { transform: scale(1.25); opacity: 0; }
}

@keyframes bounce {
  0%,60%,100% { transform: translateY(0); opacity: .4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* RESPONSIVE */

@media(min-width:1000px) {
  .app {
    box-shadow: 0 0 80px rgba(0,0,0,.35);
  }
}

@media(max-width:640px) {
  .header {
    height: 67px;
    min-height: 67px;
    padding: 0 14px;
  }

  .brand-icon {
    width: 39px;
    height: 39px;
    font-size: 21px;
  }

  .brand-text h1 {
    font-size: 17px;
  }

  .brand-text p {
    font-size: 9px;
  }

  .header-right {
    gap: 9px;
  }

  .status {
    font-size: 9px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
  }

  .chat-area {
    padding: 20px 13px;
    gap: 17px;
  }

  .welcome {
    padding: 15px 0;
  }

  .welcome-orb {
    width: 78px;
    height: 78px;
    border-radius: 25px;
    font-size: 36px;
    margin-bottom: 21px;
  }

  .suggestions {
    gap: 9px;
  }

  .suggestion {
    min-height: 61px;
    padding: 10px;
    gap: 9px;
  }

  .suggestion .emoji {
    width: 32px;
    height: 32px;
    font-size: 16px;
  }

  .suggestion-text strong {
    font-size: 11px;
  }

  .suggestion-text small {
    font-size: 9px;
  }

  .message {
    max-width: 94%;
    gap: 8px;
  }

  .avatar {
    width: 31px;
    height: 31px;
    border-radius: 10px;
  }

  .bubble {
    padding: 11px 13px;
    font-size: 12.5px;
  }

  .input-area {
    padding: 11px 11px calc(10px + env(safe-area-inset-bottom));
  }

  .input-wrapper {
    padding-left: 13px;
    gap: 7px;
  }

  #userInput {
    font-size: 13px;
  }

  .btn-send {
    width: 41px;
    height: 41px;
  }

  .disclaimer {
    font-size: 9px;
  }
}

@media(max-width:360px) {
  .status {
    display: none;
  }

  .suggestion-text small {
    display: none;
  }

  .suggestion {
    min-height: 54px;
  }
}

@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">
    <div class="brand">
      <div class="brand-icon">R</div>

      <div class="brand-text">
        <h1>REZZ AI</h1>
        <p>Asisten Pintar Masa Depan</p>
      </div>
    </div>

    <div class="header-right">
      <div class="status">
        <span class="status-dot"></span>
        <span>AI Assistant</span>
      </div>

      <button
        class="icon-btn"
        id="clearBtn"
        type="button"
        title="Hapus Chat"
        aria-label="Hapus riwayat percakapan">
        🗑️
      </button>
    </div>
  </header>

  <!-- CHAT -->

  <main class="chat-area" id="chatArea">

    <!-- WELCOME -->

    <section class="welcome" id="welcome">

      <div class="welcome-orb">🤖</div>

      <h2>Halo, saya REZZ AI</h2>

      <p class="welcome-description">
        Selamat datang di REZZ AI. Asisten pintar yang siap membantu
        menjawab pertanyaan, memberikan ide, dan menemani aktivitasmu.
      </p>

      <div class="welcome-label">
        MULAI PERCAKAPAN
      </div>

      <div class="suggestions">

        <button class="suggestion"
          type="button"
          data-q="Jelaskan tentang kecerdasan buatan secara sederhana">

          <span class="emoji">💡</span>

          <span class="suggestion-text">
            <strong>Apa itu AI?</strong>
            <small>Kenali kecerdasan buatan</small>
          </span>
        </button>

        <button class="suggestion"
          type="button"
          data-q="Buatkan puisi tentang teknologi masa depan">

          <span class="emoji">✍️</span>

          <span class="suggestion-text">
            <strong>Buat puisi</strong>
            <small>Temukan inspirasi tulisan</small>
          </span>
        </button>

        <button class="suggestion"
          type="button"
          data-q="Berikan 5 tips belajar coding untuk pemula">

          <span class="emoji">💻</span>

          <span class="suggestion-text">
            <strong>Tips coding</strong>
            <small>Belajar pemrograman</small>
          </span>
        </button>

        <button class="suggestion"
          type="button"
          data-q="Berikan resep nasi goreng sederhana">

          <span class="emoji">🍳</span>

          <span class="suggestion-text">
            <strong>Resep masakan</strong>
            <small>Ide masakan sehari-hari</small>
          </span>
        </button>

      </div>
    </section>

  </main>

  <!-- INPUT -->

  <footer class="input-area">

    <div class="input-container">

      <div class="input-wrapper">

        <textarea
          id="userInput"
          rows="1"
          placeholder="Tanyakan sesuatu kepada REZZ AI..."
          aria-label="Tulis pesan">
        </textarea>

        <button
          id="sendBtn"
          class="btn-send"
          type="button"
          title="Kirim pesan"
          aria-label="Kirim pesan">
          ➤
        </button>

      </div>

      <p class="disclaimer">
        REZZ AI dapat membuat kesalahan. Periksa informasi penting.
      </p>

    </div>

  </footer>

</div>

</body>
</html>
