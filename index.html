
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d1c">
<title>REZZ AI</title>

<style>
:root {
  --bg: #080d1c;
  --panel: #10182b;
  --panel2: #151f36;
  --blue: #258cff;
  --purple: #8b5cf6;
  --text: #f1f5ff;
  --muted: #8998b5;
  --border: rgba(115,150,210,.15);
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  height: 100dvh;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
}

/* HEADER */

header {
  height: 65px;
  min-height: 65px;
  background: rgba(13,21,40,.96);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 17px;
  z-index: 5;
}

.brand {
  font-size: 21px;
  font-weight: 900;
  letter-spacing: 1px;
}

.brand span {
  color: var(--blue);
  text-shadow: 0 0 12px var(--blue);
}

.header-actions {
  display: flex;
  gap: 8px;
}

.header-actions button {
  background: var(--panel2);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 9px 12px;
  border-radius: 10px;
  font-size: 12px;
  cursor: pointer;
}

/* CHAT AREA */

#chat-box {
  flex: 1;
  overflow-y: auto;
  padding: 22px 15px;
  display: flex;
  flex-direction: column;
  scroll-behavior: smooth;
}

#chat-box::-webkit-scrollbar {
  width: 4px;
}

#chat-box::-webkit-scrollbar-thumb {
  background: #26395c;
  border-radius: 10px;
}

/* WELCOME */

.welcome {
  margin: auto;
  width: 100%;
  max-width: 540px;
  text-align: center;
  padding: 20px 5px;
}

.ai-icon {
  width: 65px;
  height: 65px;
  border-radius: 22px;
  margin: 0 auto 20px;
  display: grid;
  place-items: center;
  font-size: 30px;
  font-weight: bold;
  background: linear-gradient(135deg,#087bff,#7949e9);
  box-shadow: 0 0 30px rgba(37,140,255,.25);
}

.welcome h1 {
  font-size: 27px;
  margin: 0 0 10px;
}

.welcome h1 span {
  color: var(--blue);
}

.welcome p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.suggestions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 28px;
  text-align: left;
}

.suggestion {
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 15px;
  border-radius: 13px;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  min-height: 85px;
}

.suggestion:active {
  border-color: var(--blue);
}

.suggestion strong {
  display: block;
  font-size: 13px;
  margin-bottom: 7px;
}

.suggestion small {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}

/* MESSAGES */

.message {
  max-width: 85%;
  padding: 13px 16px;
  margin-bottom: 17px;
  border-radius: 17px;
  font-size: 14px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.user {
  align-self: flex-end;
  background: linear-gradient(135deg,#176ee5,#6743cb);
  border-bottom-right-radius: 4px;
}

.ai {
  align-self: flex-start;
  background: var(--panel);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
}

.sender {
  font-size: 10px;
  font-weight: bold;
  color: #64b4ff;
  margin-bottom: 7px;
  letter-spacing: .5px;
}

.time {
  display: block;
  font-size: 10px;
  color: #a0aec5;
  margin-top: 7px;
}

/* THINKING */

.typing {
  display: flex;
  gap: 5px;
  padding: 5px 0;
}

.typing i {
  width: 6px;
  height: 6px;
  background: var(--blue);
  border-radius: 50%;
  animation: bounce .8s infinite alternate;
}

.typing i:nth-child(2) {
  animation-delay: .2s;
}

.typing i:nth-child(3) {
  animation-delay: .4s;
}

@keyframes bounce {
  to { opacity: .3; transform: translateY(-5px); }
}

/* INPUT */

.bottom {
  padding: 12px 13px 15px;
  background: linear-gradient(transparent,#080d1c 18%);
}

.input-area {
  max-width: 750px;
  margin: auto;
  display: flex;
  align-items: flex-end;
  gap: 9px;
  background: var(--panel);
  border: 1px solid #29466e;
  border-radius: 19px;
  padding: 9px;
  box-shadow: 0 0 18px rgba(37,140,255,.08);
}

.input-area:focus-within {
  border-color: var(--blue);
  box-shadow: 0 0 15px rgba(37,140,255,.16);
}

textarea {
  flex: 1;
  min-width: 0;
  max-height: 120px;
  resize: none;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  padding: 10px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.5;
}

textarea::placeholder {
  color: var(--muted);
}

#send-btn {
  width: 43px;
  height: 43px;
  border: none;
  border-radius: 13px;
  background: linear-gradient(135deg,#168cff,#7250eb);
  color: white;
  font-size: 20px;
  cursor: pointer;
  flex-shrink: 0;
}

#send-btn:disabled {
  opacity: .45;
}

.footer-note {
  text-align: center;
  color: #65738d;
  font-size: 10px;
  margin-top: 9px;
}

/* HISTORY PANEL */

#history-panel {
  display: none;
  position: fixed;
  inset: 65px 0 0;
  z-index: 8;
  background: rgba(0,0,0,.55);
}

.history-content {
  background: #10182b;
  width: min(85%,320px);
  height: 100%;
  padding: 20px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
}

.history-content h3 {
  margin-top: 0;
}

.history-item {
  background: var(--panel2);
  border: 1px solid var(--border);
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 9px;
  cursor: pointer;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.history-item small {
  color: var(--muted);
  display: block;
  margin-top: 5px;
}

.empty {
  color: var(--muted);
  font-size: 13px;
}

@media(max-width:380px) {
  .header-actions button {
    padding: 8px;
    font-size: 11px;
  }
  .welcome h1 {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header>
  <div class="brand">REZZ <span>AI</span></div>

  <div class="header-actions">
    <button onclick="newChat()">＋ Baru</button>
    <button onclick="toggleHistory()">☰ Riwayat</button>
  </div>
</header>

<div id="history-panel" onclick="closeHistoryOutside(event)">
  <div class="history-content">
    <h3>Riwayat Chat</h3>
    <div id="history-list"></div>
    <button onclick="clearHistory()" style="
      width:100%;padding:11px;border:0;border-radius:9px;
      background:#263b60;color:white;margin-top:15px;">
      Hapus Semua Riwayat
    </button>
  </div>
</div>

<main id="chat-box">

  <div class="welcome" id="welcome">
    <div class="ai-icon">R</div>

    <h1>Halo, Saya <span>REZZ AI</span></h1>

    <p>
      Asisten AI pintar yang siap membantu menjawab
      pertanyaan, memberikan ide, dan menemani aktivitasmu.
    </p>

    <div class="suggestions">

      <button class="suggestion"
        onclick="useSuggestion('Jelaskan teknologi kecerdasan buatan')">
        <strong>✦ Pengetahuan</strong>
        <small>Jelaskan sesuatu yang ingin saya ketahui.</small>
      </button>

      <button class="suggestion"
        onclick="useSuggestion('Bantu saya membuat sebuah aplikasi Android')">
        <strong>⌘ Pemrograman</strong>
        <small>Bantu membuat dan memperbaiki kode.</small>
      </button>

      <button class="suggestion"
        onclick="useSuggestion('Berikan saya ide kreatif yang menarik')">
        <strong>✧ Ide Kreatif</strong>
        <small>Temukan inspirasi dan gagasan baru.</small>
      </button>

      <button class="suggestion"
        onclick="useSuggestion('Ajarkan saya bahasa Inggris dari dasar')">
        <strong>▤ Belajar</strong>
        <small>Pelajari hal baru bersama REZZ AI.</small>
      </button>

    </div>
  </div>

</main>

<div class="bottom">

  <div class="input-area">
    <textarea id="user-input"
      rows="1"
      placeholder="Tanyakan apa saja kepada REZZ AI..."
      oninput="autoResize()"
      onkeydown="handleKey(event)"></textarea>

    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>

  <div class="footer-note">
    REZZ AI dapat membuat kesalahan. Periksa informasi penting.
  </div>

</div>

<script>
const API_URL = "https://rezzai.eyzz1112.workers.dev";

const chatBox = document.getElementById("chat-box");
const userInput = document.getElementById("user-input");
const sendBtn = document.getElementById("send-btn");
const welcome = document.getElementById("welcome");

let chatHistory = [];
let savedChats = [];
let isThinking = false;
let requestController = null;
let requestNumber = 0;

try {
  savedChats = JSON.parse(
    localStorage.getItem("rezz_saved_chats") || "[]"
  );
} catch(e) {
  savedChats = [];
}

function getTime() {
  return new Date().toLocaleTimeString("id-ID", {
    hour: "2-digit",
    minute: "2-digit"
  });
}

function saveHistory() {
  try {
    localStorage.setItem(
      "rezz_saved_chats",
      JSON.stringify(savedChats)
    );
  } catch(e) {
    console.warn("Riwayat tidak dapat disimpan.");
  }
}

function saveCurrentChat() {
  if (!chatHistory.length) return;

  const first = chatHistory.find(m => m.role === "user");
  if (!first) return;

  savedChats.unshift({
    id: Date.now(),
    title: first.content.slice(0, 45),
    messages: [...chatHistory]
  });

  savedChats = savedChats.slice(0, 30);
  saveHistory();
}

function addMessage(text, sender) {
  const div = document.createElement("div");
  div.className = "message " + sender;

  if (sender === "ai") {
    const label = document.createElement("div");
    label.className = "sender";
    label.textContent = "REZZ AI";
    div.appendChild(label);
  }

  const content = document.createElement("div");
  content.textContent = text;
  div.appendChild(content);

  const time = document.createElement("span");
  time.className = "time";
  time.textContent = getTime();
  div.appendChild(time);

  chatBox.appendChild(div);
  scrollBottom();

  return div;
}

function scrollBottom() {
  chatBox.scrollTop = chatBox.scrollHeight;
}

function showTyping() {
  const div = document.createElement("div");
  div.className = "message ai";

  div.innerHTML = `
    <div class="sender">REZZ AI</div>
    <div class="typing">
      <i></i><i></i><i></i>
    </div>
  `;

  chatBox.appendChild(div);
  scrollBottom();

  return div;
}

function autoResize() {
  userInput.style.height = "auto";
  userInput.style.height =
    Math.min(userInput.scrollHeight,120) + "px";
}

function handleKey(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function useSuggestion(text) {
  userInput.value = text;
  sendMessage();
}

async function sendMessage() {
  const text = userInput.value.trim();

  if (!text || isThinking) return;

  if (chatHistory.length === 0) {
    welcome.style.display = "none";
  }

  addMessage(text, "user");

  userInput.value = "";
  autoResize();

  chatHistory.push({
    role: "user",
    content: text
  });

  isThinking = true;
  sendBtn.disabled = true;

  const currentRequest = ++requestNumber;
  requestController = new AbortController();

  const typing = showTyping();

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        messages: chatHistory
      }),
      signal: requestController.signal
    });

    if (!response.ok) {
      throw new Error("Server HTTP " + response.status);
    }

    const data = await response.json();

    if (currentRequest !== requestNumber) return;

    typing.remove();

    if (!data.reply) {
      throw new Error(data.error || "Balasan AI kosong");
    }

    addMessage(data.reply, "ai");

    chatHistory.push({
      role: "assistant",
      content: data.reply
    });

    saveCurrentChat();

  } catch(error) {

    if (currentRequest !== requestNumber) return;

    typing.remove();

    if (error.name === "AbortError") return;

    addMessage(
      "Maaf, terjadi masalah saat menghubungkan ke REZZ AI. " +
      error.message,
      "ai"
    );

    // Hapus pesan terakhir agar pengguna dapat mencoba kembali.
    chatHistory.pop();

  } finally {

    if (currentRequest === requestNumber) {
      isThinking = false;
      sendBtn.disabled = false;
      requestController = null;
      userInput.focus();
    }
  }
}

function newChat() {
  if (isThinking && requestController) {
    requestNumber++;
    requestController.abort();
  }

  saveCurrentChat();

  chatHistory = [];
  isThinking = false;
  sendBtn.disabled = false;

  chatBox.innerHTML = "";
  chatBox.appendChild(welcome);
  welcome.style.display = "block";

  userInput.value = "";
  autoResize();
  userInput.focus();
}

function toggleHistory() {
  renderHistory();

  const panel = document.getElementById("history-panel");
  panel.style.display =
    panel.style.display === "block" ? "none" : "block";
}

function closeHistoryOutside(event) {
  if (event.target.id === "history-panel") {
    event.currentTarget.style.display = "none";
  }
}

function renderHistory() {
  const list = document.getElementById("history-list");
  list.innerHTML = "";

  if (!savedChats.length) {
    list.innerHTML = '<p class="empty">Belum ada riwayat percakapan.</p>';
    return;
  }

  savedChats.forEach(chat => {
    const item = document.createElement("div");
    item.className = "history-item";

    const title = document.createElement("div");
    title.textContent = chat.title;

    const date = document.createElement("small");
    date.textContent = chat.messages.length + " pesan";

    item.append(title, date);

    item.onclick = () => openChat(chat.id);

    list.appendChild(item);
  });
}

function openChat(id) {
  if (isThinking && requestController) {
    requestNumber++;
    requestController.abort();
  }

  const chat = savedChats.find(c => c.id === id);
  if (!chat) return;

  chatHistory = [...chat.messages];
  isThinking = false;
  sendBtn.disabled = false;

  chatBox.innerHTML = "";

  chatHistory.forEach(message => {
    addMessage(
      message.content,
      message.role === "user" ? "user" : "ai"
    );
  });

  document.getElementById("history-panel").style.display = "none";
}

function clearHistory() {
  if (!confirm("Hapus semua riwayat percakapan?")) return;

  savedChats = [];
  saveHistory();
  renderHistory();
}

// Inisialisasi
userInput.focus();
</script>

</body>
</html>
