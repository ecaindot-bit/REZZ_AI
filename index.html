
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>REZZ AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080d18;
 color:#f4f7ff;
 font-family:Arial,sans-serif;
 height:100dvh;
 display:flex;
 flex-direction:column;
 overflow:hidden;
}
header{
 height:68px;
 background:#111a2b;
 border-bottom:1px solid #27344b;
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 16px;
 flex-shrink:0;
}
.logo{font-size:24px;font-weight:bold}
.logo span{color:#39a0ff}
.actions{display:flex;gap:8px}
button{
 cursor:pointer;
 border:0;
 color:white;
 font-weight:bold;
}
.topbtn{
 background:#202d43;
 border:1px solid #35445e;
 padding:10px 12px;
 border-radius:10px;
}
main{
 flex:1;
 overflow-y:auto;
 padding:18px 14px 25px;
 scroll-behavior:smooth;
}
.welcome{
 text-align:center;
 margin:30px auto;
 max-width:350px;
}
.avatar{
 width:65px;height:65px;
 background:#173d68;
 border:1px solid #398bd5;
 border-radius:20px;
 display:grid;
 place-items:center;
 margin:auto;
 font-size:28px;
 font-weight:bold;
}
.welcome h2{margin-bottom:8px}
.welcome p{color:#91a2bd;line-height:1.5}
.message{
 display:flex;
 flex-direction:column;
 margin:15px 0;
}
.message.user{align-items:flex-end}
.message.bot{align-items:flex-start}
.bubble{
 max-width:88%;
 padding:14px 16px;
 border-radius:16px;
 line-height:1.55;
 white-space:pre-wrap;
 overflow-wrap:anywhere;
 font-size:15px;
}
.user .bubble{
 background:#176cb4;
 border-bottom-right-radius:4px;
}
.bot .bubble{
 background:#19263b;
 border:1px solid #273b59;
 border-bottom-left-radius:4px;
}
.time{
 font-size:10px;
 color:#70839f;
 margin:5px 5px 0;
}
.typing{
 display:flex;
 gap:5px;
 padding:17px;
}
.typing i{
 width:7px;height:7px;
 border-radius:50%;
 background:#63aaff;
 animation:blink 1s infinite;
}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{
 0%,80%,100%{opacity:.25;transform:translateY(0)}
 40%{opacity:1;transform:translateY(-5px)}
}
.suggestions{
 display:flex;
 flex-wrap:wrap;
 gap:8px;
 justify-content:center;
 margin-top:20px;
}
.suggestions button{
 background:#15243a;
 border:1px solid #304565;
 color:#b9d8ff;
 padding:10px 12px;
 border-radius:20px;
 font-size:12px;
}
footer{
 background:#111a2b;
 border-top:1px solid #27344b;
 padding:12px;
 padding-bottom:max(12px,env(safe-area-inset-bottom));
 flex-shrink:0;
}
.inputbox{
 display:flex;
 align-items:flex-end;
 gap:9px;
 background:#1a263a;
 border:1px solid #344760;
 padding:7px;
 border-radius:15px;
}
textarea{
 flex:1;
 min-width:0;
 max-height:120px;
 resize:none;
 background:transparent;
 color:white;
 border:0;
 outline:none;
 padding:10px 7px;
 font-size:15px;
 font-family:inherit;
}
textarea::placeholder{color:#8292aa}
.send{
 background:#168cff;
 padding:13px 17px;
 border-radius:11px;
}
.send:disabled{opacity:.4}
.note{
 text-align:center;
 color:#71819a;
 font-size:10px;
 margin-top:8px;
}
</style>
</head>

<body>

<header>
 <div class="logo">REZZ <span>AI</span></div>
 <div class="actions">
  <button class="topbtn" onclick="newChat()">＋ Baru</button>
  <button class="topbtn" onclick="clearChat()">Hapus</button>
 </div>
</header>

<main id="chat">
 <div class="welcome" id="welcome">
  <div class="avatar">R</div>
  <h2>Halo, saya REZZ AI.</h2>
  <p>Asisten digital Anda. Silakan tuliskan pertanyaan atau sesuatu yang ingin Anda bahas.</p>
  <div class="suggestions">
   <button onclick="suggest('Perkenalkan dirimu')">Perkenalkan dirimu</button>
   <button onclick="suggest('Apa yang bisa kamu bantu?')">Apa yang bisa kamu bantu?</button>
  </div>
 </div>
</main>

<footer>
 <div class="inputbox">
  <textarea id="input" rows="1"
   placeholder="Tanyakan sesuatu..."
   oninput="resizeInput()"
   onkeydown="handleKey(event)"></textarea>
  <button class="send" id="send" onclick="sendMessage()">Kirim</button>
 </div>
 <div class="note">REZZ AI V2.0 • Mode demo</div>
</footer>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const sendBtn=document.getElementById("send");
const STORAGE="rezz_ai_v2_history";

let history=[];

try{
 history=JSON.parse(localStorage.getItem(STORAGE)||"[]");
 if(!Array.isArray(history))history=[];
}catch(e){history=[];}

function save(){
 try{
  localStorage.setItem(STORAGE,JSON.stringify(history));
 }catch(e){}
}

function timeNow(){
 return new Date().toLocaleTimeString("id-ID",{
  hour:"2-digit",minute:"2-digit"
 });
}

function addMessage(role,text,time){
 const welcome=document.getElementById("welcome");
 if(welcome)welcome.remove();

 const wrapper=document.createElement("div");
 wrapper.className="message "+role;

 const bubble=document.createElement("div");
 bubble.className="bubble";
 bubble.textContent=text;

 const stamp=document.createElement("div");
 stamp.className="time";
 stamp.textContent=time||timeNow();

 wrapper.appendChild(bubble);
 wrapper.appendChild(stamp);
 chat.appendChild(wrapper);

 chat.scrollTop=chat.scrollHeight;
}

function render(){
 chat.innerHTML="";
 if(history.length===0){
  chat.innerHTML=`
  <div class="welcome" id="welcome">
   <div class="avatar">R</div>
   <h2>Halo, saya REZZ AI.</h2>
   <p>Asisten digital Anda. Silakan tuliskan pertanyaan atau sesuatu yang ingin Anda bahas.</p>
   <div class="suggestions">
    <button onclick="suggest('Perkenalkan dirimu')">Perkenalkan dirimu</button>
    <button onclick="suggest('Apa yang bisa kamu bantu?')">Apa yang bisa kamu bantu?</button>
   </div>
  </div>`;
  return;
 }
 history.forEach(m=>addMessage(m.role,m.text,m.time));
}

function resizeInput(){
 input.style.height="auto";
 input.style.height=Math.min(input.scrollHeight,120)+"px";
}

function handleKey(e){
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  sendMessage();
 }
}

function suggest(text){
 input.value=text;
 sendMessage();
}

function showTyping(){
 const el=document.createElement("div");
 el.className="message bot";
 el.id="typing";
 el.innerHTML='<div class="bubble typing"><i></i><i></i><i></i></div>';
 chat.appendChild(el);
 chat.scrollTop=chat.scrollHeight;
}

function removeTyping(){
 const el=document.getElementById("typing");
 if(el)el.remove();
}

function demoReply(text){
 const t=text.toLowerCase();

 if(t.includes("halo")||t.includes("hai")||t.includes("hello")){
  return "Halo! Senang bertemu denganmu. Saya REZZ AI.";
 }
 if(t.includes("nama")){
  return "Nama saya REZZ AI, asisten digital yang sedang dikembangkan.";
 }
 if(t.includes("siapa")||t.includes("perkenalkan")){
  return "Saya REZZ AI V2.0. Saya adalah antarmuka asisten digital yang sedang dikembangkan.";
 }
 if(t.includes("bantu")){
  return "Saya siap menjadi asisten digital. Saat ini saya masih berada dalam mode demo dan belum terhubung ke mesin AI.";
 }
 if(t.includes("terima kasih")||t.includes("makasih")){
  return "Sama-sama! Terima kasih sudah menggunakan REZZ AI.";
 }

 return "Pesan kamu sudah diterima oleh REZZ AI.\n\nSaat ini saya masih menggunakan mode demo. Mesin AI sungguhan belum terhubung, sehingga saya belum bisa memahami dan menjawab pertanyaan secara bebas.";
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;

 const userMessage={
  role:"user",
  text:text,
  time:timeNow()
 };

 history.push(userMessage);
 addMessage("user",text,userMessage.time);

 input.value="";
 resizeInput();
 save();

 sendBtn.disabled=true;
 showTyping();

 setTimeout(()=>{
  removeTyping();

  const reply=demoReply(text);
  const botMessage={
   role:"bot",
   text:reply,
   time:timeNow()
  };

  history.push(botMessage);
  addMessage("bot",reply,botMessage.time);
  save();
  sendBtn.disabled=false;
  input.focus();
 },900);
}

function newChat(){
 if(!confirm("Mulai percakapan baru?"))return;
 history=[];
 save();
 render();
 input.focus();
}

function clearChat(){
 if(!confirm("Hapus seluruh riwayat percakapan?"))return;
 history=[];
 save();
 render();
}

render();
</script>

</body>
</html>
